name: Trading bot

on:
  schedule:
    # Mon–Fri. GitHub cron is UTC. 15:07 UTC ≈ 10:07 New York (winter) / 11:07 (summer)
    - cron: "7 15 * * 1-5"
    # 19:37 UTC ≈ 14:37 New York – risk check (stops / targets only)
    - cron: "37 19 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = sell+buy, risk = sell checks only"
        default: "full"
        type: choice
        options: [full, risk]

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 19 * * 1-5" ]; then
            echo "mode=risk" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_LIVE_CONFIRM: ${{ secrets.ALPACA_LIVE_CONFIRM }}
        run: python trader.py --mode ${{ steps.m.outputs.mode }}

      - name: Save state and app data
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f state.json ] || exit 0
          mkdir -p /tmp/out && cp state.json status.json /tmp/out/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/out/*.json .
            git add state.json status.json
            git diff --cached --quiet && exit 0
            git commit -m "bot: ${{ steps.m.outputs.mode }} run $(date -u +%F_%H:%M)"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
